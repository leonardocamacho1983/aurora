<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aurora — sem conexão</title>
    <style>
      :root {
        --bg: #181527;
        --ink: #f0ecf7;
        --ink-soft: #b3adc4;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      main {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 24px;
        text-align: center;
      }
      h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.5rem;
        margin: 0;
      }
      p {
        color: var(--ink-soft);
        max-width: 32ch;
        margin: 0;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Aurora</h1>
      <p>Você está sem conexão. Volte quando a internet retornar — o que é seu fica guardado.</p>
    </main>
  </body>
</html>
