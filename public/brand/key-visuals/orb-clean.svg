<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Aurora clean orb key visual">
  <rect width="1200" height="630" fill="#08060F" />

  <defs>
    <linearGradient id="kv-orb-clean-base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C9A2D4" />
      <stop offset="55%" stop-color="#8FA4D6" />
      <stop offset="100%" stop-color="#7FD0C4" />
    </linearGradient>
    <radialGradient id="kv-orb-clean-warm" cx="32%" cy="26%" r="52%">
      <stop offset="0%" stop-color="#F4B6A0" />
