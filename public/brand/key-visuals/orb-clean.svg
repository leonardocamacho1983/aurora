  <circle cx="600" cy="315" r="178" fill="url(#kv-orb-clean-warm)" />
  <circle cx="600" cy="315" r="178" fill="url(#kv-orb-clean-lilac)" />
  <circle cx="600" cy="315" r="178" fill="url(#kv-orb-clean-blue)" />
