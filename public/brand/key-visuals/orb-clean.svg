    <radialGradient id="kv-orb-clean-lilac" cx="72%" cy="30%" r="56%">
      <stop offset="0%" stop-color="#C9A2D4" />
      <stop offset="100%" stop-color="#C9A2D4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="kv-orb-clean-blue" cx="74%" cy="74%" r="56%">
      <stop offset="0%" stop-color="#8FA4D6" />
