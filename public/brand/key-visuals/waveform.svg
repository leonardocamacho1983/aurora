<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Aurora waveform key visual">
  <rect width="1200" height="630" fill="#08060F" />

  <defs>
    <linearGradient id="kv-waveform-base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A99BD9" />
      <stop offset="55%" stop-color="#6F79B8" />
      <stop offset="100%" stop-color="#4C9AA0" />
    </linearGradient>
    <radialGradient id="kv-waveform-warm" cx="32%" cy="26%" r="52%">
      <stop offset="0%" stop-color="#E6A2B8" />
      <stop offset="100%" stop-color="#E6A2B8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="kv-waveform-lilac" cx="72%" cy="30%" r="56%">
      <stop offset="0%" stop-color="#B99BD9" />
      <stop offset="100%" stop-color="#B99BD9" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="kv-waveform-blue" cx="74%" cy="74%" r="56%">
      <stop offset="0%" stop-color="#768DD1" />
      <stop offset="100%" stop-color="#768DD1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="kv-waveform-teal" cx="28%" cy="76%" r="56%">
      <stop offset="0%" stop-color="#66BDB5" />
      <stop offset="100%" stop-color="#66BDB5" stop-opacity="0" />
    </radialGradient>
    <filter id="kv-waveform-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="20" />
    </filter>
  </defs>
  <circle cx="600" cy="315" r="148" fill="#A99BD9" opacity="0.5" filter="url(#kv-waveform-glow)" />
  <circle cx="600" cy="315" r="148" fill="url(#kv-waveform-base)" />
  <circle cx="600" cy="315" r="148" fill="url(#kv-waveform-warm)" />
  <circle cx="600" cy="315" r="148" fill="url(#kv-waveform-lilac)" />
  <circle cx="600" cy="315" r="148" fill="url(#kv-waveform-blue)" />
  <circle cx="600" cy="315" r="148" fill="url(#kv-waveform-teal)" />
  <g fill="#F8F6FC" opacity="0.76"><rect x="526" y="309" width="6" height="12" rx="3"/><rect x="542" y="305" width="6" height="20" rx="3"/><rect x="558" y="300" width="6" height="30" rx="3"/><rect x="574" y="288" width="6" height="54" rx="3"/><rect x="590" y="270" width="6" height="90" rx="3"/><rect x="606" y="282" width="6" height="66" rx="3"/><rect x="622" y="298" width="6" height="34" rx="3"/><rect x="638" y="306" width="6" height="18" rx="3"/><rect x="654" y="310" width="6" height="10" rx="3"/></g>
</svg>
